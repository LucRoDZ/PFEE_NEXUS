apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: audit
  namespace: hdg
spec:
  podSelector:
    matchLabels:
      app: audit
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: hdg
      podSelector:
        matchLabels:
          app: consent
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: hdg
      podSelector:
        matchLabels:
          app: data-api
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: hospital
      podSelector:
        matchLabels:
          app: keybroker
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: hospital
      podSelector:
        matchLabels:
          app: anchor
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: hospital
      podSelector:
        matchLabels:
          app: gateway
    ports:
    - port: 8000
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
---
