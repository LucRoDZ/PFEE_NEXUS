apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hdg-data
  namespace: hdg
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit
  namespace: hdg
  labels:
    app: audit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: audit
  template:
    metadata:
      labels:
        app: audit
        nexus/volume: hdg-data
    spec:
      nodeSelector:
        nexus/site: hdg
      automountServiceAccountToken: false
      containers:
      - name: audit
        image: nexus-poc:0.1
        imagePullPolicy: IfNotPresent
        command:
        - python
        - -m
        - uvicorn
        - nexus.hdg.audit:app
        - --host
        - 0.0.0.0
        - --port
        - '8000'
        env:
        - name: NEXUS_AUDIT_URL
          value: http://audit.hdg.svc:8000
        - name: NEXUS_CONSENT_URL
          value: http://consent.hdg.svc:8000
        - name: NEXUS_DATA_URL
          value: http://data-api.hdg.svc:8000
        - name: NEXUS_BROKER_URL
          value: http://keybroker.hospital.svc:8000
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: data
          mountPath: /data
        ports:
        - containerPort: 8000
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 5
      volumes:
      - name: tmp
        emptyDir: {}
      - name: data
        persistentVolumeClaim:
          claimName: hdg-data
---
apiVersion: v1
kind: Service
metadata:
  name: audit
  namespace: hdg
spec:
  selector:
    app: audit
  ports:
  - port: 8000
    targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: consent
  namespace: hdg
  labels:
    app: consent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: consent
  template:
    metadata:
      labels:
        app: consent
        nexus/volume: hdg-data
    spec:
      nodeSelector:
        nexus/site: hdg
      automountServiceAccountToken: false
      containers:
      - name: consent
        image: nexus-poc:0.1
        imagePullPolicy: IfNotPresent
        command:
        - python
        - -m
        - uvicorn
        - nexus.hdg.consent:app
        - --host
        - 0.0.0.0
        - --port
        - '8000'
        env:
        - name: NEXUS_AUDIT_URL
          value: http://audit.hdg.svc:8000
        - name: NEXUS_CONSENT_URL
          value: http://consent.hdg.svc:8000
        - name: NEXUS_DATA_URL
          value: http://data-api.hdg.svc:8000
        - name: NEXUS_BROKER_URL
          value: http://keybroker.hospital.svc:8000
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: data
          mountPath: /data
        ports:
        - containerPort: 8000
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 5
      volumes:
      - name: tmp
        emptyDir: {}
      - name: data
