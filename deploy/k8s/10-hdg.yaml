apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-api
  namespace: hdg
  labels:
    app: data-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: data-api
  template:
    metadata:
      labels:
        app: data-api
    spec:
      nodeSelector:
        nexus/site: hdg
      automountServiceAccountToken: false
      containers:
      - name: data-api
        image: nexus-poc:0.1
        imagePullPolicy: IfNotPresent
        command:
        - python
        - -m
        - uvicorn
        - nexus.hdg.data_api:app
        - --host
        - 0.0.0.0
        - --port
        - '8000'
        env:
        - name: NEXUS_AUDIT_URL
          value: http://audit.hdg.svc:8000
        - name: NEXUS_CONSENT_URL
          value: http://consent.hdg.svc:8000
        - name: NEXUS_DATA_URL
          value: http://data-api.hdg.svc:8000
        - name: NEXUS_BROKER_URL
          value: http://keybroker.hospital.svc:8000
        - name: NEXUS_S3_ENDPOINT
          value: http://garage.garage.svc:3900
        - name: NEXUS_S3_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: garage-credentials
              key: access_key
        - name: NEXUS_S3_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: garage-credentials
              key: secret_key
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        ports:
        - containerPort: 8000
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 5
      volumes:
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: data-api
  namespace: hdg
spec:
  selector:
    app: data-api
  ports:
  - port: 8000
    targetPort: 8000
